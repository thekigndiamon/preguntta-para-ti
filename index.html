<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una pregunta para ti 💌</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffd6e7, #fff0f6);
            font-family: Arial, sans-serif;
        }

        .caja {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            color: #e75480;
            margin-bottom: 25px;
        }

        #pregunta {
            font-size: 22px;
            color: #444;
            min-height: 80px;
        }

        button {
            border: none;
            padding: 12px 25px;
            margin: 8px;
            border-radius: 20px;
            font-size: 17px;
            cursor: pointer;
            transition: 0.2s;
        }

        .si {
            background: #ff6f9c;
            color: white;
        }

        .no {
            background: #eee;
            color: #555;
        }

        button:hover {
            transform: scale(1.05);
        }

        .oculto {
            display: none;
        }
    </style>
</head>

<body>

    <div class="caja">

        <h1>💌 Una pregunta para ti</h1>

        <div id="pregunta">
            ¿Puedo hacerte una pregunta? 👀
        </div>

        <div id="botones">
            <button class="si" onclick="responder(true)">Sí 💗</button>
            <button class="no" onclick="responder(false)">No 🙈</button>
        </div>

    </div>

    <script>

        let paso = 0;

        const preguntas = [

            {
                texto: "¿Te gustaría conocerme un poquito más? 👀❤️"
            },

            {
                texto: "¿Te gustaría que siguiéramos hablando y compartiendo más momentos? 😊"
            },

            {
                texto: "¿Te puedo decir algo que quería decirte hace un tiempo? 💌"
            }

        ];

        function responder(si) {

            const pregunta = document.getElementById("pregunta");
            const botones = document.getElementById("botones");

            if (!si) {

                pregunta.innerHTML =
                    "¿Segura? 👀<br><br>Piénsalo otra vez... jeje ❤️";

                return;
            }

            paso++;

            if (paso < preguntas.length) {

                pregunta.innerHTML = preguntas[paso].texto;

            } else {

                pregunta.innerHTML =
                    "Aunque no pude conocerte como me hubiera gustado, " +
                    "me está gustando de verdad conocerte ahora, " +
                    "aunque sea como amiga. ❤️<br><br>" +

                    "Me alegra mucho poder conocerte y compartir contigo. ✨<br><br>" +

                    "Quizás este detalle sea pequeño... 🥺❤️<br>" +
                    "pero está hecho con mucho cariño.<br><br>" +

                    "Atentamente,<br>" +
                    "tu hacker anónimo 🕶️💻❤️";

                botones.innerHTML = "";

            }

        }

    </script>

</body>
</html>
